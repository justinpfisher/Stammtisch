name: Celebration regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/celebration-*.yml'
      - '.github/workflows/annals-*.yml'
      - '.github/workflows/col-source-observe.yml'
      - 'annals.html'
      - 'annals-photos.*'
      - 'photos.html'
      - 'col-revisions.html'
      - 'col-rules-version.*'
      - 'col-rules-reader.mjs'
      - 'col-rules-witness.mjs'
      - 'col-rules-register.mjs'
      - 'data/col-releases/**'
      - 'data/photos/**'
      - 'data/col-rules*.json'
      - 'history.html'
      - 'data/annals-approved.json'
      - 'data/club-history.json'
      - 'scripts/**'
      - 'data/celebration*.json'
      - 'celebration*.mjs'
      - 'col-push.mjs'
      - 'manifest.json'
      - 'data/col-push-config.json'
      - 'push/**'
      - 'celebration.html'
      - 'celebration.css'
      - 'index.html'
      - 'styles.css'
      - 'monthly.mjs'
      - 'stammtisch-monthly.ics'
      - 'assembly.mjs'
      - 'assembly-2027.ics'
      - 'location.html'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Keep CI on GitHub-hosted runners; this is a public repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local-equivalent Python and Node regression checks
        run: node scripts/local-dev.mjs check
