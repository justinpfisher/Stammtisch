name: Celebration regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/celebration-*.yml'
      - 'scripts/**'
      - 'data/celebration*.json'
      - 'celebration*.mjs'
      - 'col-push.mjs'
      - 'manifest.json'
      - 'data/col-push-config.json'
      - 'push/**'
      - 'celebration.html'
      - 'celebration.css'
      - 'index.html'
      - 'styles.css'
      - 'monthly.mjs'
      - 'stammtisch-monthly.ics'
      - 'assembly.mjs'
      - 'assembly-2027.ics'
      - 'location.html'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Keep CI on GitHub-hosted runners; this is a public repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local-equivalent Python and Node regression checks
        run: node scripts/local-dev.mjs check
      - name: Confirm existing public site register is readable
        # The current committed data is already published. This is a bounded
        # connectivity smoke to validate the publication guard before rollout.
        run: python scripts/verify-celebration-publication.py --expected data/celebration.json --commit ci-smoke --attempts 1 --pause 0
