name: Publish signed and consented Annals entry

on:
  repository_dispatch:
    types: [annals-approved-entry, annals-auto-entry, annals-correct-entry, annals-remove-entry]

permissions:
  contents: write

concurrency:
  group: annals-approved-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed consent and render public-safe archive
        env:
          ANNALS_PUBLISH_SIGNING_KEY: ${{ secrets.ANNALS_PUBLISH_SIGNING_KEY }}
          ANNALS_PHOTOS_GUARDED_JPEG_ENABLED: ${{ vars.ANNALS_PHOTOS_GUARDED_JPEG_ENABLED }}
          ANNALS_PHOTOS_V2_RELEASE_ENABLED: ${{ vars.ANNALS_PHOTOS_V2_RELEASE_ENABLED }}
          ANNALS_SIGNING_REMEDIATION_VERIFIED: ${{ vars.ANNALS_SIGNING_REMEDIATION_VERIFIED }}
          ANNALS_PHOTOS_ACCEPTANCE_ENTRY_ID: ${{ vars.ANNALS_PHOTOS_ACCEPTANCE_ENTRY_ID }}
          ANNALS_PHOTOS_ACCEPTANCE_UNTIL: ${{ vars.ANNALS_PHOTOS_ACCEPTANCE_UNTIL }}
          ANNALS_PHOTO_BLOB_TRANSPORT_ENABLED: ${{ vars.ANNALS_PHOTO_BLOB_TRANSPORT_ENABLED }}
        run: node scripts/annals/apply-approved-entry.mjs
      - name: Commit consented public entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- annals.html data/annals-approved.json data/photos assets
          git diff --cached --quiet && exit 1
          git commit -m "Publish approved Annals update"
          git push origin HEAD:main
