name: Publish signed and consented Annals entry

on:
  repository_dispatch:
    types: [annals-approved-entry, annals-auto-entry, annals-correct-entry, annals-remove-entry]

permissions:
  contents: write
  pages: write

concurrency:
  group: annals-approved-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify signed consent and render public-safe archive
        env:
          ANNALS_PUBLISH_SIGNING_KEY: ${{ secrets.ANNALS_PUBLISH_SIGNING_KEY }}
          ANNALS_PHOTOS_GUARDED_JPEG_ENABLED: ${{ vars.ANNALS_PHOTOS_GUARDED_JPEG_ENABLED }}
          ANNALS_PHOTOS_V2_RELEASE_ENABLED: ${{ vars.ANNALS_PHOTOS_V2_RELEASE_ENABLED }}
          ANNALS_SIGNING_REMEDIATION_VERIFIED: ${{ vars.ANNALS_SIGNING_REMEDIATION_VERIFIED }}
          ANNALS_PHOTOS_ACCEPTANCE_ENTRY_ID: ${{ vars.ANNALS_PHOTOS_ACCEPTANCE_ENTRY_ID }}
          ANNALS_PHOTOS_ACCEPTANCE_UNTIL: ${{ vars.ANNALS_PHOTOS_ACCEPTANCE_UNTIL }}
          ANNALS_PHOTO_BLOB_TRANSPORT_ENABLED: ${{ vars.ANNALS_PHOTO_BLOB_TRANSPORT_ENABLED }}
        run: node scripts/annals/apply-approved-entry.mjs
      - name: Prepare optional image treatment (existing hosted runner)
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local image tools
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check --quiet numpy==1.26.4 opencv-python-headless==4.11.0.86
      - name: Create separate moody cocktail image derivatives
        # The original just passed exact signed approval and source screening.
        # This optional visual postprocessing never blocks the signed entry.
        # If quality is uncertain, the public viewer uses the original JPEG.
        continue-on-error: true
        run: python scripts/annals/cocktail-image-style.py --index data/annals-approved.json
      - name: Commit consented public entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- annals.html data/annals-approved.json data/photos assets
          git diff --cached --quiet && exit 1
          git commit -m "Publish approved Annals update"
          git push origin HEAD:main
      - name: Request existing Pages deployment
        # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
        # Private reconciliation separately verifies actual hosted content.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/justinpfisher/Stammtisch/pages/builds
