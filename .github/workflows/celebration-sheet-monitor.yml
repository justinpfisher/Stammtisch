name: Celebration sheet monitor

on:
  # Reconcile once when this workflow is changed, including initial deployment.
  push:
    branches: [main]
    paths:
      - '.github/workflows/celebration-sheet-monitor.yml'
      - 'scripts/monitor-celebration-sheet.py'
      - 'scripts/sync-celebration-sheet.py'
      - 'scripts/import-celebration.py'
      - 'tests/celebration.test.mjs'
      - 'tests/celebration-awards.test.mjs'
      - 'tests/test_site_sync.py'
      - 'data/celebration-confirmations.json'
  schedule:
    - cron: '58 * * * *'
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      initialize:
        description: Create the first encrypted baseline (required when no state artifact exists)
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  issues: write
  pages: write

concurrency:
  group: celebration-sheet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Scheduled checks run by default after explicit baseline initialization.
    # Set CELEBRATION_SHEET_MONITOR_ENABLED=false only to pause them.
    if: github.event_name == 'workflow_dispatch' || vars.CELEBRATION_SHEET_MONITOR_ENABLED != 'false'
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
      MONITOR_STATE_KEY: ${{ secrets.MONITOR_STATE_KEY }}
      SPREADSHEET_ID: 1B8tZFjIa5FsyBaex42Atg7pJ5Y86Lj1vHeJMRhrqrCY
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned monitor dependencies
        run: python -m pip install google-auth==2.35.0 requests==2.32.3 cryptography==43.0.3
      - name: Restore latest encrypted baseline
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p monitor-state
          url="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=celebration-sheet-monitor-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .archive_download_url // empty')"
          if [ -n "$url" ]; then
            gh api "$url" > monitor-state.zip
            unzip -q monitor-state.zip -d monitor-state
            state_file="$(find monitor-state -name baseline.enc -type f -print -quit)"
            if [ -z "$state_file" ]; then echo 'State artifact did not contain baseline.enc' >&2; exit 1; fi
            [ "$state_file" = monitor-state/baseline.enc ] || mv "$state_file" monitor-state/baseline.enc
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require an explicit first baseline
        if: steps.state.outputs.found != 'true' && inputs.initialize != true
        run: |
          echo 'No unexpired encrypted baseline exists. Re-run workflow_dispatch with initialize=true.' >&2
          exit 1
      - name: Fetch and compare workbook read-only
        run: |
          init=''
          if [ "${{ inputs.initialize }}" = 'true' ]; then init='--initialize'; fi
          python scripts/monitor-celebration-sheet.py --previous-baseline monitor-state/baseline.enc --baseline monitor-state/next-baseline.enc --report monitor-state/change-report.enc --workbook-json monitor-state/current-workbook.json $init > monitor-result.json
          changed="$(python -c "import json; print(str(json.load(open('monitor-result.json'))['changed']).lower())")"
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          publication_inputs_changed="$(python -c "import json; print(str(json.load(open('monitor-result.json'))['publicationInputsChanged']).lower())")"
          printf 'publication_inputs_changed=%s\n' "$publication_inputs_changed" >> "$GITHUB_OUTPUT"
        id: compare
      - name: Open or update a metadata-only change alert
        if: success() && steps.compare.outputs.changed == 'true' && vars.CELEBRATION_SHEET_MONITOR_ISSUES_ENABLED != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const result = require('./monitor-result.json');
            const metadata = result.changes.map(c => `- sheetId ${c.sheetId}: ${c.kind}${c.cells ? ` (${c.cellCount} cells: ${c.cells.join(', ')})` : ''}`).join('\n');
            const title = 'Celebration Sheet monitor: meaningful change detected';
            const body = `<!-- sheet-monitor:${result.alertKey} -->\nA read-only monitor detected a meaningful Sheet change at ${result.checkedAt}.\n\n${metadata}\n\nNo cell values, formulas, notes, or excerpts are included here. The encrypted workflow artifact contains the detailed comparison.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (existing) { const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, per_page: 100 }); if (![existing.body, ...comments.map(c => c.body)].some(text => text.includes(`sheet-monitor:${result.alertKey}`))) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body }); }
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Reconcile current Sheet with published website data
        # A previous monitor baseline may already include edits missing from the site.
        # Run after every successful normal comparison, not just a new sheet diff.
        if: success() && inputs.initialize != true
        id: site_sync
        run: |
          checked="$(python -c "import json; print(json.load(open('monitor-result.json'))['checkedAt'])")"
          python scripts/sync-celebration-sheet.py --workbook monitor-state/current-workbook.json --checked-at "$checked" --status monitor-state/site-sync-status.json
      - name: Verify generated site data and award calculations
        if: success() && steps.site_sync.outcome == 'success'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Commit verified website data
        if: success() && steps.site_sync.outcome == 'success'
        id: site_commit
        run: |
          if git diff --quiet -- data/celebration.json data/celebration-confirmations.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No material public-site data changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/celebration.json data/celebration-confirmations.json
            git commit -m 'Refresh Celebration website from verified Sheet changes'
            # A competing edit to main must fail rather than be overwritten.
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish and verify GitHub Pages
        if: success() && steps.site_sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do NOT trigger branch-based GitHub Pages builds.
          target="$(git rev-parse HEAD)"
          live_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$target" != "$live_ref" ]; then
            echo 'main advanced while attempting to publish; retry from a fresh checkout' >&2
            exit 1
          fi
          latest_commit="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit // empty' 2>/dev/null || true)"
          latest_status="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status // empty' 2>/dev/null || true)"
          if [ "$latest_commit" = "$target" ] && [ "$latest_status" = built ]; then
            echo 'Pages has already built the current commit.'
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
            published='false'
            for attempt in $(seq 1 24); do
              sleep 10
              build="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")"
              commit="$(echo "$build" | jq -r '.commit // empty')"
              status="$(echo "$build" | jq -r '.status // empty')"
              if [ "$commit" = "$target" ] && [ "$status" = built ]; then
                published='true'
                break
              fi
              if [ "$commit" = "$target" ] && [ "$status" = errored ]; then
                echo 'GitHub Pages build failed for the new site data.' >&2
                exit 1
              fi
            done
            if [ "$published" != true ]; then
              echo 'GitHub Pages did not confirm the target commit was built.' >&2
              exit 1
            fi
          fi
      - name: Record successful website publication
        if: success() && steps.site_commit.outputs.changed == 'true' && vars.CELEBRATION_SHEET_MONITOR_ISSUES_ENABLED != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const result = require('./monitor-result.json');
            const title = 'Celebration Sheet monitor: meaningful change detected';
            const marker = '<!-- site-published:' + result.alertKey + ' -->';
            const body = marker + '\nThe verified website data was updated and the GitHub Pages build completed in run ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '. The site calculates standings, commemorations, awards and draft previews from the updated register.';
            const { data: issues } = await github.rest.issues.listForRepo({ owner:context.repo.owner, repo:context.repo.repo, state:'open', per_page:100 });
            const issue = issues.find(item => item.title === title);
            if (issue) {
              const { data: comments } = await github.rest.issues.listComments({ owner:context.repo.owner, repo:context.repo.repo, issue_number:issue.number, per_page:100 });
              if (![issue.body, ...comments.map(c => c.body)].some(text => text?.includes(marker)))
                await github.rest.issues.createComment({ owner:context.repo.owner, repo:context.repo.repo, issue_number:issue.number, body });
            } else {
              // A change captured before publisher activation won't have a new
              // monitor alert. Record the public-data reconciliation explicitly.
              const title = 'Celebration website sync: verified register refresh published';
              const { data: existing } = await github.rest.issues.listForRepo({ owner:context.repo.owner, repo:context.repo.repo, state:'open', per_page:100 });
              const prior = existing.find(item => item.title === title);
              if (prior) {
                const { data: comments } = await github.rest.issues.listComments({ owner:context.repo.owner, repo:context.repo.repo, issue_number:prior.number, per_page:100 });
                if (![prior.body, ...comments.map(c => c.body)].some(text => text?.includes(marker)))
                  await github.rest.issues.createComment({ owner:context.repo.owner, repo:context.repo.repo, issue_number:prior.number, body });
              } else {
                await github.rest.issues.create({ owner:context.repo.owner, repo:context.repo.repo, title, body });
              }
            }
      - name: Promote successful comparison state
        if: success()
        run: mv monitor-state/next-baseline.enc monitor-state/baseline.enc
      - name: Upload encrypted baseline and report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-sheet-monitor-state
          path: |
            monitor-state/baseline.enc
            monitor-state/change-report.enc
          if-no-files-found: error
          retention-days: 30
      - name: Preserve encrypted change report when publication is blocked
        if: failure() && steps.compare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: celebration-sheet-monitor-review-${{ github.run_id }}
          path: monitor-state/change-report.enc
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update a monitor failure alert
        if: failure() && vars.CELEBRATION_SHEET_MONITOR_ISSUES_ENABLED != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const statusPath = 'monitor-state/site-sync-status.json';
            const status = fs.existsSync(statusPath) ? JSON.parse(fs.readFileSync(statusPath, 'utf8')) : null;
            const reviewRequired = status?.status === 'review_required';
            const title = reviewRequired ? 'Celebration website sync: independent verification required' : 'Celebration Sheet monitor: run failed';
            const runLink = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = reviewRequired
              ? 'The latest Sheet edit includes ' + status.pending + ' newly reported passing(s) without sufficient independent corroboration. No unverified website data was published. Review the encrypted change report from ' + runLink + ', add a sourced confirmation or correct the Sheet, and the next hourly check will retry. No Sheet cell content is included here.'
              : 'The monitor or website update failed in run ' + runLink + '. The previous encrypted baseline remains available so the check can retry.' + (status?.errorCode ? ' Safe diagnostic category: ' + status.errorCode + '.' : '');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            } else {
              const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, per_page: 100 });
              if (![existing.body, ...comments.map(c => c.body)].some(text => text?.includes(runLink)))
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            }
