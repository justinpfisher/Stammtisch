name: Celebration sheet monitor

on:
  schedule:
    - cron: '58 * * * *'
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      initialize:
        description: Create the first encrypted baseline (required when no state artifact exists)
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: celebration-sheet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Scheduled checks are opt-in. A dispatch remains available to initialize or test it.
    if: github.event_name == 'workflow_dispatch' || vars.CELEBRATION_SHEET_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
      MONITOR_STATE_KEY: ${{ secrets.MONITOR_STATE_KEY }}
      SPREADSHEET_ID: 1B8tZFjIa5FsyBaex42Atg7pJ5Y86Lj1vHeJMRhrqrCY
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned monitor dependencies
        run: python -m pip install google-auth==2.35.0 requests==2.32.3 cryptography==43.0.3
      - name: Restore latest encrypted baseline
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p monitor-state
          url="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=celebration-sheet-monitor-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .archive_download_url // empty')"
          if [ -n "$url" ]; then
            gh api "$url" > monitor-state.zip
            unzip -q monitor-state.zip -d monitor-state
            state_file="$(find monitor-state -name baseline.enc -type f -print -quit)"
            if [ -z "$state_file" ]; then echo 'State artifact did not contain baseline.enc' >&2; exit 1; fi
            [ "$state_file" = monitor-state/baseline.enc ] || mv "$state_file" monitor-state/baseline.enc
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require an explicit first baseline
        if: steps.state.outputs.found != 'true' && inputs.initialize != true
        run: |
          echo 'No unexpired encrypted baseline exists. Re-run workflow_dispatch with initialize=true.' >&2
          exit 1
      - name: Fetch and compare workbook read-only
        run: |
          init=''
          if [ "${{ inputs.initialize }}" = 'true' ]; then init='--initialize'; fi
          python scripts/monitor-celebration-sheet.py --previous-baseline monitor-state/baseline.enc --baseline monitor-state/next-baseline.enc --report monitor-state/change-report.enc $init > monitor-result.json
          changed="$(python -c "import json; print(str(json.load(open('monitor-result.json'))['changed']).lower())")"
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
        id: compare
      - name: Open or update a metadata-only change alert
        if: success() && steps.compare.outputs.changed == 'true' && vars.CELEBRATION_SHEET_MONITOR_ISSUES_ENABLED != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const result = require('./monitor-result.json');
            const metadata = result.changes.map(c => `- sheetId ${c.sheetId}: ${c.kind}${c.cells ? ` (${c.cellCount} cells: ${c.cells.join(', ')})` : ''}`).join('\n');
            const title = 'Celebration Sheet monitor: meaningful change detected';
            const body = `<!-- sheet-monitor:${result.alertKey} -->\nA read-only monitor detected a meaningful Sheet change at ${result.checkedAt}.\n\n${metadata}\n\nNo cell values, formulas, notes, or excerpts are included here. The encrypted workflow artifact contains the detailed comparison.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (existing) { const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, per_page: 100 }); if (![existing.body, ...comments.map(c => c.body)].some(text => text.includes(`sheet-monitor:${result.alertKey}`))) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body }); }
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Promote successful comparison state
        if: success()
        run: mv monitor-state/next-baseline.enc monitor-state/baseline.enc
      - name: Upload encrypted baseline and report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-sheet-monitor-state
          path: |
            monitor-state/baseline.enc
            monitor-state/change-report.enc
          if-no-files-found: error
          retention-days: 30
      - name: Open or update a monitor failure alert
        if: failure() && vars.CELEBRATION_SHEET_MONITOR_ISSUES_ENABLED != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Celebration Sheet monitor: run failed';
            const body = `The read-only monitor failed in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. No workbook payload was published.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (!existing) await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
