name: Observe CoL source Sheet (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install existing pinned read-only monitor dependencies
        run: python -m pip install google-auth==2.35.0 requests==2.32.3
      - name: Observe source without storing or logging cells
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/observe-col-source.py > col-source-observation.json
      - name: Preserve public-safe observation
        uses: actions/upload-artifact@v4
        with:
          name: col-source-readonly-observation
          path: col-source-observation.json
          retention-days: 30
      - name: Show digest and evidence limits
        run: cat col-source-observation.json >> "$GITHUB_STEP_SUMMARY"
