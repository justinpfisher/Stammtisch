name: Observe CoL source Sheet (read-only)

on:
  push:
    branches: [main]
    paths:
      - col-numeric-*.mjs
      - col-prospective.mjs
      - col-club-state.mjs
      - celebration-rules.mjs
      - data/celebration.json
      - data/celebration-confirmations.json
      - data/col-club-state.json
      - data/col-numeric-trust.json
      - scripts/qualify-col-prospective.py
      - tests/col-numeric-adapter.test.mjs
      - tests/col-numeric-publication.test.mjs
      - scripts/col-numeric-publication.mjs
      - scripts/col-numeric-live-witness.mjs
      - scripts/annals/NumericTransport.gs
      - tests/annals-numeric-transport.test.mjs
      - .github/workflows/annals-col-numeric-release.yml
      - tests/col-prospective.test.mjs
      - .github/workflows/col-source-observe.yml
  workflow_dispatch:
    inputs:
      qualification:
        description: Read-only observation or prospective calculation qualification
        type: choice
        options: [snapshot, prospective]
        default: snapshot

permissions:
  contents: read

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: inputs.qualification == 'prospective' || github.event_name == 'push'
        with:
          node-version: '22'
      - name: Install existing pinned read-only monitor dependencies
        run: python -m pip install google-auth==2.35.0 requests==2.32.3
      - name: Observe source without storing or logging cells
        if: inputs.qualification != 'prospective' && github.event_name != 'push'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/observe-col-source.py > col-source-observation.json
      - name: Qualify prospective calculations against the independent Viewer source
        if: inputs.qualification == 'prospective' || github.event_name == 'push'
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/qualify-col-prospective.py > col-source-observation.json
      - name: Preserve public-safe observation
        uses: actions/upload-artifact@v4
        with:
          name: col-source-readonly-observation
          path: col-source-observation.json
          retention-days: 30
      - name: Show digest and evidence limits
        run: cat col-source-observation.json >> "$GITHUB_STEP_SUMMARY"
