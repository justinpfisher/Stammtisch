name: One-time Annals source transfer package

on:
  pull_request:
    paths:
      - '.github/workflows/annals-source-transfer-package.yml'

permissions:
  contents: read

jobs:
  source-only-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reviewed public installation source package
        run: |
          python scripts/annals/build-install-package.py --ref HEAD --output "$RUNNER_TEMP/annals-install-source-only.zip"
          (cd "$RUNNER_TEMP" && sha256sum annals-install-source-only.zip > annals-install-source-only.sha256)
      - name: Independently check the complete source manifest
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'annals-install-source-only.zip'
          with zipfile.ZipFile(source) as z:
              manifest=json.loads(z.read('source-manifest.json'))
              commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              assert manifest['sourceCommit']==commit
              assert manifest['installed'] is False
              assert manifest['credentialsIncluded'] is False
              assert manifest['publicationActivated'] is False
              assert len(manifest['files'])==19
              for record in manifest['files']:
                  assert hashlib.sha256(z.read(record['install'])).hexdigest()==record['sha256']
          print('Public-only source package verified; no Apps Script deployment has occurred.')
          PY
      - name: Stage only the seven changed modules and offline verifier
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          archive=Path(os.environ['RUNNER_TEMP'])/'annals-install-source-only.zip'
          root=Path(os.environ['RUNNER_TEMP'])/'annals-private-transfer-kit'
          (root/'install').mkdir(parents=True,exist_ok=True)
          names=['Production.gs','HistoryProduction.gs','PhotoProduction.gs',
                 'GuardedRelease.gs','RulesProduction.gs','PilotCore.gs','RulesCore.gs']
          with zipfile.ZipFile(archive) as z:
              manifest=json.loads(z.read('source-manifest.json'))
              records={r['install']:r for r in manifest['files']}
              (root/'source-manifest.json').write_bytes(z.read('source-manifest.json'))
              for name in names:
                  key='install/'+name
                  data=z.read(key)
                  assert hashlib.sha256(data).hexdigest()==records[key]['sha256']
                  (root/'install'/name).write_bytes(data)
          shutil.copyfile('scripts/annals/private-source-transfer-offline.html',
                          root/'private-source-transfer-offline.html')
          (root/'README.txt').write_text(
              'Source-only transfer kit. No credentials, private files or deployed changes.\n'
              '1. Extract this archive locally. Open private-source-transfer-offline.html locally.\n'
              '2. Select source-manifest.json and the seven files in install/.\n'
              '3. Confirm source commit and use the helper to copy and independently\n'
              '   verify the saved content of each matching existing Apps Script file.\n'
              '4. Preserve the existing owner-only deployment, manifest, private state\n'
              '   and trigger; then use the established runbook to deploy and verify.\n')
          print('Seven source SHA-256 matches and offline readback helper packaged.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stammtisch-annals-reviewed-source-transfer
          path: ${{ runner.temp }}/annals-private-transfer-kit/
          retention-days: 30
          if-no-files-found: error
