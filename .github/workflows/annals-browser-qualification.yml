name: Annals fictional browser qualification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/annals-browser-qualification.yml'
      # Browser fixtures use the shared renderers/cores, not private .gs adapters
      # or the Python installation packager. Backend checks remain in PR CI.
      - 'scripts/annals/*.mjs'
      - 'scripts/annals/*.js'
      - 'scripts/annals/*.html'
      - 'tests/browser/**'
      - 'tests/annals-safe-media.test.mjs'
      - 'annals.html'
      - 'history.html'
      - 'styles.css'
      - 'annals-photos.*'
      - 'photos.html'
      - 'col-revisions.html'
      - 'col-rules-reader.mjs'
      - 'col-rules-witness.mjs'
      - 'col-rules-register.mjs'
      - 'col-rules-version.*'
      - 'celebration.html'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned test-only dependencies
        working-directory: tests/browser
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit for fictional qualification
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium webkit
      - name: Run loopback-only fictional browser checks
        working-directory: tests/browser
        run: npm run check
